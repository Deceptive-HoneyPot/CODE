<!-- Four vector diagrams for the paper, authored as standalone inline SVG.
     Rendered on the paper's white page, so ink is #111 on #fff with a small
     set of accent hues carrying meaning. Each <figure> is embedded verbatim
     into paper.html. -->

<!-- ============================================================= -->
<!-- FIGURE 1: System architecture                                  -->
<!-- ============================================================= -->
<figure id="fig-arch">
<svg viewBox="0 0 720 430" role="img" aria-label="System architecture: an external attacker reaches a connection proxy and monitoring dashboard on the public boundary; the proxy forwards to five decoys on an isolated internal network; decoys call a tiered response engine and post records to a collector that classifies, hashes, stores in Redis, and anchors to a local Ethereum chain" style="max-width:100%;height:auto;font-family:'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><polygon points="0,0 7,3 0,6" fill="#111"/></marker>
    <marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><polygon points="0,0 7,3 0,6" fill="#2a78d6"/></marker>
  </defs>

  <!-- public boundary -->
  <rect x="8" y="8" width="704" height="90" rx="6" fill="none" stroke="#c9c8c2" stroke-dasharray="4 3"/>
  <text x="18" y="24" font-size="11" fill="#888" font-style="italic">Public boundary</text>

  <rect x="24" y="34" width="120" height="46" rx="5" fill="#fdece6" stroke="#eb6834"/>
  <text x="84" y="55" font-size="12" text-anchor="middle" fill="#111">Attacker /</text>
  <text x="84" y="70" font-size="12" text-anchor="middle" fill="#111">scanner</text>

  <rect x="300" y="34" width="120" height="46" rx="5" fill="#fff" stroke="#111"/>
  <text x="360" y="61" font-size="12" text-anchor="middle" fill="#111">Connection proxy</text>

  <rect x="576" y="34" width="120" height="46" rx="5" fill="#fff" stroke="#111"/>
  <text x="636" y="61" font-size="12" text-anchor="middle" fill="#111">Dashboard</text>

  <line x1="144" y1="57" x2="298" y2="57" stroke="#111" marker-end="url(#ah)"/>
  <text x="221" y="50" font-size="10.5" text-anchor="middle" fill="#555">connect</text>

  <!-- internal boundary -->
  <rect x="8" y="112" width="704" height="308" rx="6" fill="none" stroke="#2a78d6" stroke-dasharray="5 3"/>
  <text x="18" y="130" font-size="11" fill="#2a78d6" font-style="italic">Isolated internal network</text>

  <!-- five decoys -->
  <g font-size="11" fill="#111">
    <rect x="24" y="146" width="150" height="34" rx="4" fill="#eef4fc" stroke="#2a78d6"/><text x="99" y="167" text-anchor="middle">SSH shell (2222)</text>
    <rect x="24" y="188" width="150" height="34" rx="4" fill="#eef4fc" stroke="#2a78d6"/><text x="99" y="209" text-anchor="middle">PostgreSQL (5433)</text>
    <rect x="24" y="230" width="150" height="34" rx="4" fill="#eef4fc" stroke="#2a78d6"/><text x="99" y="251" text-anchor="middle">AI API (8080)</text>
    <rect x="24" y="272" width="150" height="34" rx="4" fill="#eef4fc" stroke="#2a78d6"/><text x="99" y="293" text-anchor="middle">Ethereum RPC (8545)</text>
    <rect x="24" y="314" width="150" height="34" rx="4" fill="#eef4fc" stroke="#2a78d6"/><text x="99" y="335" text-anchor="middle">Jenkins CI/CD (9090)</text>
  </g>
  <text x="99" y="368" font-size="10.5" text-anchor="middle" fill="#555" font-style="italic">Five decoys</text>

  <!-- proxy down into decoys -->
  <line x1="360" y1="80" x2="360" y2="120" stroke="#111"/>
  <line x1="360" y1="120" x2="180" y2="120" stroke="#111"/>
  <line x1="180" y1="120" x2="180" y2="163" stroke="#111" marker-end="url(#ah)"/>
  <text x="250" y="114" font-size="10.5" text-anchor="middle" fill="#555">forward</text>

  <!-- response engine -->
  <rect x="250" y="200" width="150" height="70" rx="5" fill="#fff" stroke="#111"/>
  <text x="325" y="228" font-size="12" text-anchor="middle" fill="#111">Tiered response</text>
  <text x="325" y="244" font-size="12" text-anchor="middle" fill="#111">engine</text>
  <text x="325" y="260" font-size="10" text-anchor="middle" fill="#555">static · cache · LM</text>

  <line x1="174" y1="235" x2="248" y2="235" stroke="#111" marker-end="url(#ah)"/>
  <text x="211" y="228" font-size="10" text-anchor="middle" fill="#555">query</text>

  <!-- LM cloud -->
  <rect x="250" y="300" width="150" height="40" rx="20" fill="#f4f0fb" stroke="#9085e9"/>
  <text x="325" y="325" font-size="11" text-anchor="middle" fill="#111">Hosted LM API</text>
  <line x1="325" y1="270" x2="325" y2="298" stroke="#9085e9" stroke-dasharray="3 2" marker-end="url(#ah)"/>
  <text x="371" y="288" font-size="9.5" text-anchor="middle" fill="#7a6fd0">novel only</text>

  <!-- collector -->
  <rect x="470" y="146" width="150" height="120" rx="5" fill="#fff" stroke="#111"/>
  <text x="545" y="168" font-size="12" text-anchor="middle" fill="#111" font-weight="bold">Collector</text>
  <text x="545" y="188" font-size="10.5" text-anchor="middle" fill="#333">1. classify intent</text>
  <text x="545" y="204" font-size="10.5" text-anchor="middle" fill="#333">2. SHA-256 hash</text>
  <text x="545" y="220" font-size="10.5" text-anchor="middle" fill="#333">3. store record</text>
  <text x="545" y="236" font-size="10.5" text-anchor="middle" fill="#333">4. anchor digest</text>
  <text x="545" y="256" font-size="10.5" text-anchor="middle" fill="#333">5. stream to UI</text>

  <line x1="174" y1="163" x2="360" y2="120" stroke="#111" opacity="0"/>
  <!-- decoys -> collector -->
  <line x1="174" y1="200" x2="468" y2="200" stroke="#111" marker-end="url(#ah)"/>
  <text x="330" y="194" font-size="10" text-anchor="middle" fill="#555">POST record</text>

  <!-- collector -> redis + chain + dashboard -->
  <rect x="470" y="300" width="70" height="40" rx="4" fill="#eafaf3" stroke="#1baf7a"/>
  <text x="505" y="324" font-size="11" text-anchor="middle" fill="#111">Redis</text>
  <rect x="556" y="300" width="90" height="40" rx="4" fill="#eafaf3" stroke="#1baf7a"/>
  <text x="601" y="319" font-size="10.5" text-anchor="middle" fill="#111">Ethereum</text>
  <text x="601" y="333" font-size="10.5" text-anchor="middle" fill="#111">chain</text>

  <line x1="520" y1="266" x2="510" y2="298" stroke="#111" marker-end="url(#ah)"/>
  <line x1="575" y1="266" x2="595" y2="298" stroke="#111" marker-end="url(#ah)"/>
  <text x="640" y="286" font-size="9.5" fill="#555">hash</text>

  <!-- collector -> dashboard (up across boundary) -->
  <line x1="620" y1="150" x2="636" y2="82" stroke="#2a78d6" marker-end="url(#ahb)"/>
  <text x="660" y="120" font-size="10" text-anchor="middle" fill="#2a78d6">live feed</text>
</svg>
<figcaption><strong>Fig. 1.</strong> System architecture. Only the proxy and dashboard sit on the public boundary; the five decoys, the tiered response engine, the collector, the datastore, and the blockchain node communicate solely on the isolated internal network. Each decoy queries the response engine and posts a record to the collector, which classifies, hashes, stores, anchors, and streams it.</figcaption>
</figure>


<!-- ============================================================= -->
<!-- FIGURE 2: Request data-flow / sequence                         -->
<!-- ============================================================= -->
<figure id="fig-flow">
<svg viewBox="0 0 720 250" role="img" aria-label="Sequence of a single interaction: the proxy logs the connection, the decoy receives the request, the response engine answers from static, cache, or the language model, the decoy replies to the attacker and posts a record, and the collector classifies, hashes, anchors on-chain, and streams to the dashboard" style="max-width:100%;height:auto;font-family:'Helvetica Neue',Arial,sans-serif">
  <defs><marker id="ah2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><polygon points="0,0 7,3 0,6" fill="#111"/></marker></defs>
  <!-- lifelines -->
  <g font-size="10.5" fill="#111" text-anchor="middle">
    <text x="70" y="22">Attacker</text><line x1="70" y1="30" x2="70" y2="230" stroke="#c9c8c2"/>
    <text x="205" y="22">Proxy</text><line x1="205" y1="30" x2="205" y2="230" stroke="#c9c8c2"/>
    <text x="340" y="22">Decoy</text><line x1="340" y1="30" x2="340" y2="230" stroke="#c9c8c2"/>
    <text x="480" y="22">Response eng.</text><line x1="480" y1="30" x2="480" y2="230" stroke="#c9c8c2"/>
    <text x="640" y="22">Collector</text><line x1="640" y1="30" x2="640" y2="230" stroke="#c9c8c2"/>
  </g>
  <g font-size="10" fill="#333">
    <line x1="70" y1="50" x2="203" y2="50" stroke="#111" marker-end="url(#ah2)"/><text x="135" y="44" text-anchor="middle">connect</text>
    <line x1="205" y1="72" x2="638" y2="72" stroke="#2a78d6" marker-end="url(#ah2)" opacity="0.9"/><text x="420" y="66" text-anchor="middle" fill="#2a78d6">log connection</text>
    <line x1="205" y1="94" x2="338" y2="94" stroke="#111" marker-end="url(#ah2)"/><text x="272" y="88" text-anchor="middle">forward request</text>
    <line x1="340" y1="116" x2="478" y2="116" stroke="#111" marker-end="url(#ah2)"/><text x="410" y="110" text-anchor="middle">get response</text>
    <line x1="478" y1="138" x2="342" y2="138" stroke="#111" marker-end="url(#ah2)"/><text x="410" y="132" text-anchor="middle">static / cache / LM</text>
    <line x1="338" y1="160" x2="72" y2="160" stroke="#111" marker-end="url(#ah2)"/><text x="205" y="154" text-anchor="middle">realistic reply</text>
    <line x1="340" y1="182" x2="638" y2="182" stroke="#111" marker-end="url(#ah2)"/><text x="490" y="176" text-anchor="middle">POST record</text>
    <line x1="640" y1="204" x2="640" y2="204" stroke="#111"/>
    <text x="640" y="200" text-anchor="middle" fill="#1baf7a" font-size="9.5">classify · hash · anchor · stream</text>
    <rect x="590" y="208" width="100" height="16" rx="3" fill="#eafaf3" stroke="#1baf7a"/>
    <text x="640" y="220" text-anchor="middle" font-size="9">on-chain + dashboard</text>
  </g>
</svg>
<figcaption><strong>Fig. 2.</strong> Data flow for one interaction. The proxy logs the connection before any decoy responds; the decoy obtains a reply from the tiered engine and answers the attacker; the collector then classifies, hashes, anchors the digest on-chain, and streams the event to the dashboard.</figcaption>
</figure>


<!-- ============================================================= -->
<!-- FIGURE 3: Three-tier response path                             -->
<!-- ============================================================= -->
<figure id="fig-tier">
<svg viewBox="0 0 720 220" role="img" aria-label="Three-tier decision path: an incoming request checks the static table first and returns in under a millisecond on a hit; on a miss it checks the cache and returns in about a millisecond on a hit; only on a cache miss does it call the language model, taking on the order of seconds, after which the result is cached" style="max-width:100%;height:auto;font-family:'Helvetica Neue',Arial,sans-serif">
  <defs><marker id="ah3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><polygon points="0,0 7,3 0,6" fill="#111"/></marker></defs>

  <rect x="12" y="90" width="96" height="40" rx="5" fill="#fff" stroke="#111"/>
  <text x="60" y="114" font-size="11" text-anchor="middle">Request</text>

  <!-- tier 1 -->
  <polygon points="150,110 200,86 250,110 200,134" fill="#eef4fc" stroke="#2a78d6"/>
  <text x="200" y="107" font-size="10" text-anchor="middle">static</text>
  <text x="200" y="119" font-size="10" text-anchor="middle">table?</text>

  <!-- tier 2 -->
  <polygon points="330,110 380,86 430,110 380,134" fill="#eef4fc" stroke="#2a78d6"/>
  <text x="380" y="107" font-size="10" text-anchor="middle">cache</text>
  <text x="380" y="119" font-size="10" text-anchor="middle">hit?</text>

  <!-- tier 3 LM -->
  <rect x="510" y="88" width="120" height="44" rx="22" fill="#f4f0fb" stroke="#9085e9"/>
  <text x="570" y="107" font-size="11" text-anchor="middle">Language</text>
  <text x="570" y="121" font-size="11" text-anchor="middle">model</text>

  <line x1="108" y1="110" x2="148" y2="110" stroke="#111" marker-end="url(#ah3)"/>
  <line x1="250" y1="110" x2="328" y2="110" stroke="#111" marker-end="url(#ah3)"/>
  <text x="289" y="104" font-size="9.5" text-anchor="middle" fill="#555">miss</text>
  <line x1="430" y1="110" x2="508" y2="110" stroke="#111" marker-end="url(#ah3)"/>
  <text x="469" y="104" font-size="9.5" text-anchor="middle" fill="#555">miss</text>

  <!-- returns -->
  <line x1="200" y1="134" x2="200" y2="184" stroke="#1baf7a" marker-end="url(#ah3)"/>
  <text x="200" y="200" font-size="10" text-anchor="middle" fill="#1baf7a">hit &rarr; &lt;1 ms</text>
  <line x1="380" y1="134" x2="380" y2="184" stroke="#1baf7a" marker-end="url(#ah3)"/>
  <text x="380" y="200" font-size="10" text-anchor="middle" fill="#1baf7a">hit &rarr; ~1 ms</text>
  <line x1="570" y1="132" x2="570" y2="184" stroke="#eb6834" marker-end="url(#ah3)"/>
  <text x="570" y="200" font-size="10" text-anchor="middle" fill="#eb6834">seconds; cached</text>

  <text x="360" y="50" font-size="10.5" text-anchor="middle" fill="#555" font-style="italic">Escalate only on a miss &mdash; routine load never reaches the model</text>
</svg>
<figcaption><strong>Fig. 3.</strong> Three-tier response path. Routine requests are answered from the static table or the cache in sub-millisecond to millisecond time; only genuinely novel requests reach the language model, paying its multi-second latency, whose result is then cached.</figcaption>
</figure>


<!-- ============================================================= -->
<!-- FIGURE 4: Blockchain anchoring and tamper check                -->
<!-- ============================================================= -->
<figure id="fig-chain">
<svg viewBox="0 0 720 250" role="img" aria-label="Anchoring and verification: a record is serialized and hashed with SHA-256, the digest is committed on-chain; to verify, the stored record is re-hashed and compared to the on-chain digest — an untampered record matches, a modified record produces a different hash and is detected" style="max-width:100%;height:auto;font-family:'Helvetica Neue',Arial,sans-serif">
  <defs><marker id="ah4" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><polygon points="0,0 7,3 0,6" fill="#111"/></marker></defs>

  <text x="16" y="24" font-size="11" fill="#555" font-style="italic">Anchoring (at log time)</text>
  <rect x="16" y="34" width="120" height="40" rx="5" fill="#fff" stroke="#111"/><text x="76" y="58" font-size="11" text-anchor="middle">Record</text>
  <rect x="180" y="34" width="120" height="40" rx="5" fill="#fff" stroke="#111"/><text x="240" y="53" font-size="11" text-anchor="middle">SHA-256</text><text x="240" y="66" font-size="9.5" text-anchor="middle" fill="#555">digest</text>
  <rect x="344" y="34" width="150" height="40" rx="5" fill="#eafaf3" stroke="#1baf7a"/><text x="419" y="53" font-size="11" text-anchor="middle">On-chain tx</text><text x="419" y="66" font-size="9.5" text-anchor="middle" fill="#555">(immutable)</text>
  <line x1="136" y1="54" x2="178" y2="54" stroke="#111" marker-end="url(#ah4)"/>
  <line x1="300" y1="54" x2="342" y2="54" stroke="#111" marker-end="url(#ah4)"/><text x="321" y="47" font-size="9" text-anchor="middle" fill="#555">commit</text>

  <line x1="16" y1="96" x2="704" y2="96" stroke="#e0dfd9"/>

  <text x="16" y="122" font-size="11" fill="#555" font-style="italic">Verification (any time later)</text>
  <rect x="16" y="140" width="130" height="40" rx="5" fill="#fff" stroke="#111"/><text x="81" y="164" font-size="11" text-anchor="middle">Stored record</text>
  <rect x="190" y="140" width="120" height="40" rx="5" fill="#fff" stroke="#111"/><text x="250" y="164" font-size="11" text-anchor="middle">re-hash</text>
  <polygon points="360,160 410,136 460,160 410,184" fill="#fff" stroke="#111"/><text x="410" y="164" font-size="10" text-anchor="middle">match?</text>

  <line x1="146" y1="160" x2="188" y2="160" stroke="#111" marker-end="url(#ah4)"/>
  <line x1="310" y1="160" x2="358" y2="160" stroke="#111" marker-end="url(#ah4)"/>
  <line x1="410" y1="136" x2="410" y2="90" stroke="#111" stroke-dasharray="3 2" marker-end="url(#ah4)"/><text x="470" y="112" font-size="9" text-anchor="middle" fill="#555">vs on-chain digest</text>

  <rect x="500" y="126" width="200" height="28" rx="5" fill="#eafaf3" stroke="#1baf7a"/><text x="600" y="144" font-size="10.5" text-anchor="middle" fill="#111">equal &rarr; record intact</text>
  <rect x="500" y="166" width="200" height="28" rx="5" fill="#fdece6" stroke="#eb6834"/><text x="600" y="184" font-size="10.5" text-anchor="middle" fill="#111">differs &rarr; tampering detected</text>
  <line x1="460" y1="152" x2="498" y2="140" stroke="#1baf7a" marker-end="url(#ah4)"/>
  <line x1="460" y1="168" x2="498" y2="180" stroke="#eb6834" marker-end="url(#ah4)"/>
</svg>
<figcaption><strong>Fig. 4.</strong> Anchoring and tamper verification. At log time the record's SHA-256 digest is committed on-chain. To verify, the stored record is re-hashed and compared with the immutable on-chain digest: a match confirms integrity; any post-hoc modification yields a different hash and is detected, independent of the logging host.</figcaption>
</figure>

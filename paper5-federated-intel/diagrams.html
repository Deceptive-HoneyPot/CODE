<!doctype html>
<html><head><meta charset="utf-8"><style>
  body{margin:0;background:#fff;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;color:#0b0b0b}
  .card{padding:10px 12px;background:#fff}
  svg{display:block}
  text{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
</style></head><body>

<!-- Hub model vs hub-less model. Designed at 1000px for a 7in text width:
     1px = 0.5pt, so 16px labels print at 8pt and 13px notes at 6.5pt. -->
<div class="card" id="hubcompare">
<svg width="1000" height="360" viewBox="0 0 1000 360">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#52514e"/>
    </marker>
    <marker id="arg" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1baf7a"/>
    </marker>
  </defs>

  <!-- LEFT: centralized hub -->
  <text x="235" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#e0524f">(a) Centralized hub</text>

  <g font-size="16" font-weight="600" text-anchor="middle">
    <circle cx="80" cy="100" r="36" fill="#fff" stroke="#52514e" stroke-width="2"/>
    <text x="80" y="97">P1</text><text x="80" y="115" font-size="12" font-weight="400" fill="#52514e">honeypot</text>
    <circle cx="80" cy="200" r="36" fill="#fff" stroke="#52514e" stroke-width="2"/>
    <text x="80" y="197">P2</text><text x="80" y="215" font-size="12" font-weight="400" fill="#52514e">honeypot</text>
    <circle cx="80" cy="290" r="36" fill="#fff" stroke="#52514e" stroke-width="2"/>
    <text x="80" y="287">P3</text><text x="80" y="305" font-size="12" font-weight="400" fill="#52514e">honeypot</text>
  </g>

  <rect x="260" y="150" width="200" height="100" rx="10" fill="#fdeee7" stroke="#e0524f" stroke-width="2.5"/>
  <text x="360" y="185" text-anchor="middle" font-size="18" font-weight="700" fill="#e0524f">Hub server</text>
  <text x="360" y="208" text-anchor="middle" font-size="13" fill="#52514e">stores raw IOCs, correlates</text>
  <text x="360" y="228" text-anchor="middle" font-size="13" fill="#e0524f">single point of trust and failure</text>

  <line x1="118" y1="112" x2="255" y2="170" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="118" y1="200" x2="255" y2="200" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="118" y1="278" x2="255" y2="230" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/>
  <text x="150" y="190" text-anchor="middle" font-size="13" fill="#52514e">raw IOC r</text>

  <text x="235" y="350" text-anchor="middle" font-size="13" fill="#52514e">a new node must be enrolled with, and trust, the hub operator</text>

  <!-- divider -->
  <line x1="500" y1="15" x2="500" y2="350" stroke="#d8d7d0" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- RIGHT: hub-less ledger -->
  <text x="750" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1baf7a">(b) Hub-less shared ledger (this work)</text>

  <g font-size="16" font-weight="600" text-anchor="middle">
    <circle cx="590" cy="100" r="36" fill="#fff" stroke="#52514e" stroke-width="2"/>
    <text x="590" y="97">P1</text><text x="590" y="115" font-size="12" font-weight="400" fill="#52514e">honeypot</text>
    <circle cx="750" cy="85" r="36" fill="#fff" stroke="#52514e" stroke-width="2"/>
    <text x="750" y="82">P2</text><text x="750" y="100" font-size="12" font-weight="400" fill="#52514e">honeypot</text>
    <circle cx="910" cy="100" r="36" fill="#fff" stroke="#52514e" stroke-width="2"/>
    <text x="910" y="97">P3</text><text x="910" y="115" font-size="12" font-weight="400" fill="#52514e">honeypot</text>
  </g>

  <rect x="620" y="195" width="260" height="90" rx="10" fill="#e9f7f1" stroke="#1baf7a" stroke-width="2.5"/>
  <text x="750" y="225" text-anchor="middle" font-size="18" font-weight="700" fill="#1baf7a">Shared ledger L</text>
  <text x="750" y="248" text-anchor="middle" font-size="13" fill="#52514e">append-only; carries only tags ⟨i, h⟩</text>
  <text x="750" y="268" text-anchor="middle" font-size="13" fill="#52514e">no contract, no registry, no owner</text>

  <line x1="614" y1="128" x2="680" y2="190" stroke="#1baf7a" stroke-width="2" marker-end="url(#arg)"/>
  <line x1="750" y1="121" x2="750" y2="190" stroke="#1baf7a" stroke-width="2" marker-end="url(#arg)"/>
  <line x1="886" y1="128" x2="820" y2="190" stroke="#1baf7a" stroke-width="2" marker-end="url(#arg)"/>
  <text x="760" y="152" text-anchor="start" font-size="13" fill="#52514e">tag ⟨i, H(κ(r))⟩</text>

  <!-- late-joining reader -->
  <circle cx="940" cy="240" r="36" fill="#fff" stroke="#1baf7a" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="940" y="237" text-anchor="middle" font-size="16" font-weight="600">P4</text>
  <text x="940" y="255" text-anchor="middle" font-size="12" fill="#1baf7a">joins later</text>
  <line x1="884" y1="240" x2="908" y2="240" stroke="#1baf7a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arg)"/>

  <text x="750" y="320" text-anchor="middle" font-size="13" fill="#52514e">nodes never message one another; each writes to and reads from L directly</text>
  <text x="750" y="340" text-anchor="middle" font-size="13" fill="#1baf7a">any reader computes Ω(h) = {i : ⟨i,h⟩ ∈ L} from ledger history alone</text>
</svg>
</div>

</body></html>

name: Continuous Integration & Test Suite

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Run Automated Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx fastapi redis pydantic

      - name: Execute Automated Test Suite
        run: |
          python tests/run_all_tests.py

      - name: Validate MITRE ATT&CK Corpus Schema
        run: |
          python -m pytest tests/test_mitre_corpus.py -v

      - name: Run Performance Profiler
        run: |
          python tools/performance_profiler.py --iterations 30

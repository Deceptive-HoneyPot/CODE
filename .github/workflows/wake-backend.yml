# Wakes the Render free-tier backend during active hours (08:00-22:00 IST).
# The backend's own keep-alive (KEEPALIVE_HOURS) holds it awake inside the
# window and lets it sleep outside it; this job wakes it each morning and
# again if it ever spun down mid-day. GitHub may delay scheduled runs.
name: Wake backend

on:
  schedule:
    - cron: "30,45 2 * * *"    # 08:00, 08:15 IST
    - cron: "*/15 3-15 * * *"  # 08:30-21:15 IST
    - cron: "0,15 16 * * *"    # 21:30, 21:45 IST
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://honeypot-backend-rcqz.onrender.com' }}
        run: curl -fsS -m 90 --retry 3 --retry-delay 10 "$BACKEND_URL/health"
